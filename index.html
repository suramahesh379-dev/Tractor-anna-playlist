<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚜 Tractor Anna Playlist</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

.hero{
padding:60px 20px;
text-align:center;
background:linear-gradient(135deg,#065f46,#0f172a);
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.hero p{
opacity:.9;
}

.player-box{
max-width:900px;
margin:25px auto;
padding:20px;
background:#1e293b;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.cover{
font-size:70px;
margin-bottom:15px;
}

.controls{
display:flex;
justify-content:center;
gap:15px;
margin:15px 0;
flex-wrap:wrap;
}

.controls button{
padding:12px 18px;
border:none;
border-radius:30px;
cursor:pointer;
font-weight:bold;
background:#f59e0b;
}

iframe{
width:100%;
height:450px;
border:none;
border-radius:15px;
}

.section{
max-width:1100px;
margin:auto;
padding:30px 15px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
}

.share-btn,
.linkedin-btn{
display:inline-block;
margin:10px;
padding:12px 20px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
color:white;
}

.share-btn{
background:#25D366;
}

.linkedin-btn{
background:#0A66C2;
}

footer{
text-align:center;
padding:30px;
background:#111827;
margin-top:30px;
}

@media(max-width:768px){

.hero h1{
font-size:32px;
}

iframe{
height:260px;
}

}
</style>
</head>

<body>

<div class="hero">

<h1>🚜 Tractor Anna Playlist</h1>

<p>
పొలాల్లో వినే తెలుగు పాటలు • Village Vibes • Telugu Classics
</p>

</div>

<div class="player-box">

<div class="cover">🚜🎵</div>

<h2>Now Playing</h2>

<div class="controls">
<button>⏮ Previous</button>
<button>▶ Play</button>
<button>⏭ Next</button>
</div>

<iframe

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚜 Tractor Anna Playlist</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
overflow-x:hidden;
}

.hero{
height:100vh;
background:url('tractor-bg.jpg') center center/cover no-repeat;
position:relative;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:rgba(0,0,0,.45);
}

.hero-content{
position:relative;
z-index:2;
}

.topbar{
position:absolute;
top:20px;
left:20px;
right:20px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:10;
}

.logo{
font-size:26px;
font-weight:bold;
}

.socials a{
color:white;
text-decoration:none;
margin-left:10px;
padding:10px 15px;
border-radius:20px;
background:rgba(0,0,0,.5);
}

h1{
font-size:70px;
font-weight:900;
}

.subtitle{
letter-spacing:4px;
margin-top:10px;
opacity:.9;
}

.rotating-disc{
width:160px;
height:160px;
border-radius:50%;
border:8px solid rgba(255,255,255,.2);
margin:30px auto;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
animation:spin 8s linear infinite;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

.player{
position:fixed;
left:50%;
bottom:25px;
transform:translateX(-50%);
width:95%;
max-width:1100px;
background:rgba(0,0,0,.8);
backdrop-filter:blur(10px);
border-radius:40px;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
z-index:100;
}

.songinfo{
flex:1;
}

.songtitle{
font-size:20px;
font-weight:bold;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.controls button{
border:none;
padding:14px 18px;
border-radius:50px;
font-size:18px;
cursor:pointer;
background:#fff;
}

.footer{
padding:80px 20px 140px;
text-align:center;
font-size:18px;
}

.btn{
display:inline-block;
padding:12px 20px;
border-radius:30px;
text-decoration:none;
margin:10px;
color:white;
}

.instagram{
background:#E1306C;
}

.linkedin{
background:#0A66C2;
}

.horn-btn{
background:#ffb300!important;
}

@media(max-width:768px){

h1{
font-size:42px;
}

.player{
flex-direction:column;
border-radius:25px;
}

.rotating-disc{
width:120px;
height:120px;
font-size:55px;
}
}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">🚜 Tractor Anna</div>

<div class="socials">

<a href="https://www.instagram.com/smash__09" target="_blank">
📸 @smash__09
</a>

<a href="https://www.linkedin.com/in/mahesh-sura-5466a73a5" target="_blank">
💼 LinkedIn
</a>

</div>
</div>

<section class="hero">

<div class="hero-content">

<div class="subtitle">
TRACTOR ANNA • PLAYLIST
</div>

<h1>ట్రాక్టర్ అన్న</h1>

<div class="subtitle">
TELUGU CLASSICS • VILLAGE VIBES
</div>

<div class="rotating-disc">
🚜
</div>

</div>

</section>

<div class="player">

<div class="songinfo">
<div class="songtitle" id="songTitle">
Song 1
</div>
<div id="status">
Ready to Play
</div>
</div>

<div class="controls">

<button onclick="prevSong()">⏮</button>

<button onclick="playPause()">▶️</button>

<button onclick="nextSong()">⏭</button>

<button class="horn-btn" onclick="playHorn()">
📯 Horn
</button>

</div>

</div>

<div class="footer">

<h2>🚜 Tractor Anna Playlist</h2>

<p>Made with ❤️ by Mahesh Sura</p>

<a class="btn instagram"
href="https://www.instagram.com/smash__09"
target="_blank">
Instagram
</a>

<a class="btn linkedin"
href="https://www.linkedin.com/in/mahesh-sura-5466a73a5"
target="_blank">
Connect on LinkedIn
</a>

</div>

<div id="player"></div>

<audio id="hornAudio">
<source src="tractor-horn.mp3" type="audio/mpeg">
</audio>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

const songs = [

{
title:"Song 1",
id:"1hF05xNRJdI"
},

{
title:"Song 2",
id:"26qZNn8KXB0"
},

{
title:"Song 3",
id:"IwAmfFxpuSg"
},

{
title:"Song 4",
id:"P3PKuW6CSFQ"
}

];

let current=0;
let player;

function onYouTubeIframeAPIReady(){

player=new YT.Player('player',{

height:'0',
width:'0',
videoId:songs[0].id

});

document.getElementById('songTitle').innerText=songs[0].title;
}

function loadSong(index){

current=index;

document.getElementById('songTitle').innerText=
songs[current].title;

player.loadVideoById(
songs[current].id
);

player.playVideo();

document.getElementById('status').innerText=
'Playing';
}

function nextSong(){

current++;

if(current>=songs.length){
current=0;
}

loadSong(current);
}

function prevSong(){

current--;

if(current<0){
current=songs.length-1;
}

loadSong(current);
}

function playPause(){

if(!player) return;

const state=player.getPlayerState();

if(state===1){

player.pauseVideo();

document.getElementById('status').innerText='Paused';

}else{

player.playVideo();

document.getElementById('status').innerText='Playing';
}
}

function playHorn(){

document.getElementById('hornAudio').play();

}
</script>

</body>
</html>
